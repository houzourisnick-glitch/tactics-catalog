name: Curriculum Design Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  qa-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate JSON Schema (Tactics Catalog)
        run: python validate_catalog.py

      - name: Run Markdown Pre-Flight QA Audit
        run: |
          for file in curriculum/*.md; do
            if [ -f "$file" ]; then
              python qa_parser.py "$file"
            fi
          done